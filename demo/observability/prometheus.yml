global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: services
    honor_labels: true   # keep the app's own `service` label
    static_configs:
      - {targets: ["gateway:8000"],   labels: {service: gateway}}
      - {targets: ["orders:8000"],    labels: {service: orders}}
      - {targets: ["payments:8000"],  labels: {service: payments}}
      - {targets: ["inventory:8000"], labels: {service: inventory}}
